name: Apply unified Early LIVE terminal patch

on:
  push:
    branches:
      - feat/early-notification-terminal-20261105
    paths:
      - .github/workflows/apply-early-live-terminal.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/early-notification-terminal-20261105
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply unified Early terminal
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          def replace_one(path, old, new):
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one match for {old!r}, found {text.count(old)}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_one(
              'binance_momentum_bot/early_autotrader_v2.py',
              'limits = dict(margin=(5, 100), leverage=(1, 5), min_score=(85, 100),',
              'limits = dict(margin=(5, 200), leverage=(1, 10), min_score=(85, 100),',
          )

          adapter_path = Path('binance_momentum_bot/early_v2_adapter.py')
          adapter = adapter_path.read_text(encoding='utf-8')
          adapter = adapter.replace(
              'from notification_policy import early_signal_notifications_enabled',
              'from notification_policy import (early_signal_notifications_enabled,\n'
              '                                 set_early_signal_notifications_enabled)',
              1,
          )
          start = adapter.index('    def status(self):\n')
          end = adapter.index('    async def show(self, session, chat, message=None, markup=None):\n', start)
          panel = textwrap.indent(r'''def status(self):
              p = self.pilot
              selector = p.selector_report(recent_limit=0)
              notifications = early_signal_notifications_enabled()
              nominal = float(p.cfg.margin) * int(p.cfg.leverage)
              api_ready = bool(self.b.get('BINANCE_API_KEY') and self.b.get('BINANCE_API_SECRET'))
              live_ready = bool(p.live_allowed and p.score_validated and api_ready)
              state = '\U0001f7e2 A\u00c7IK' if notifications else '\u26aa KAPALI'
              execution = 'A\u00c7IK' if p.cfg.execution else 'KAPALI'
              score_gate = 'A\u00c7IK' if p.cfg.score_gate else 'KAPALI'
              readiness = 'HAZIR' if live_ready else 'K\u0130L\u0130TL\u0130'
              kill = 'AKT\u0130F' if p.halted else 'kapal\u0131'
              return (
                  f'\u26a1 EARLY TERM\u0130NAL\u0130\n\n'
                  f'Bildirimler: {state}\n'
                  f'\u0130\u015flem modu: {p.mode}\n'
                  f'Anapara (teminat): {p.cfg.margin:g} USDT\n'
                  f'Kald\u0131ra\u00e7: {p.cfg.leverage}x\n'
                  f'Nominal pozisyon: yakla\u015f\u0131k {nominal:g} USDT\n\n'
                  f'Kaynak: Public Early + mevcut Early V2 se\u00e7ici/g\u00fcvenlik kap\u0131lar\u0131\n'
                  f'Min V2 skor: {p.cfg.min_score:g} | max pozisyon: {p.cfg.max_positions}\n'
                  f'G\u00fcnl\u00fck giri\u015f: {p.cfg.daily_trades} | zarar rezervi: {p.cfg.daily_loss:g} USDT | cooldown: {p.cfg.cooldown_s} sn\n'
                  f'Execution V2: {execution} | score gate: {score_gate}\n'
                  f'LIVE yetkisi/do\u011frulamas\u0131: {readiness}\n'
                  f'Kill: {kill} | Fallback TP +%{p.cfg.fallback_tp_pct:g}\n'
                  f'Selector shadow: {selector["qualified"]}/{selector["total"]} se\u00e7ildi | '
                  f'60dk olgun: {selector["qualified_stats"]["mature60"]}\n'
                  f'Profit Lock: {p.profit_mode}\n\n'
                  'LIVE ge\u00e7i\u015fi ikinci onay gerektirir. Ayarlar yaln\u0131z OFF modunda de\u011fi\u015ftirilir.'
              )

          def markup(self):
              buttons = [('Bildirimler','notify'),('Mod','mode'),('Anapara','margin'),('Kald\u0131ra\u00e7','leverage'),
                  ('Min V2 Score','min_score'),('Max Pozisyon','max_positions'),('Risk Ayarlar\u0131','risk'),
                  ('Execution V2','execution'),('Profit Lock','profit'),('Pozisyonlar','positions'),
                  ('G\u00fcnl\u00fck Rapor','report'),('Kill Switch','kill'),('Fallback TP','fallback_tp_pct')]
              return {'inline_keyboard': [[{'text':label, 'callback_data':'ev2:'+action} for label,action in buttons[i:i+2]]
                                          for i in range(0,len(buttons),2)]}

          ''', '    ')
          adapter = adapter[:start] + panel + adapter[end:]
          adapter = adapter.replace(
              'choices = dict(margin=(5,10,25,50,100), leverage=(1,2,3,5), min_score=(85,90,95,98),',
              'choices = dict(margin=(5,10,25,50,100,150,200), leverage=(1,2,3,5,7,10), min_score=(85,90,95,98),',
              1,
          )
          anchor = "            elif cmd == 'risk':\n"
          notify = r'''            elif cmd == 'notify':
                          enabled = not early_signal_notifications_enabled()
                          set_early_signal_notifications_enabled(enabled)
                          message = 'Early bildirimleri a\u00e7\u0131ld\u0131.' if enabled else 'Early bildirimleri kapat\u0131ld\u0131.'
                      elif cmd == 'risk':
          '''
          if adapter.count(anchor) != 1:
              raise SystemExit('risk anchor mismatch')
          adapter = adapter.replace(anchor, notify, 1)
          adapter_path.write_text(adapter, encoding='utf-8')

          ux_path = Path('binance_momentum_bot/telegram_ux.py')
          ux = ux_path.read_text(encoding='utf-8')
          menu_start = ux.index('MENU = (\n')
          menu_end = ux.index('ALIASES =', menu_start)
          menu = r'''MENU = (
              ('\u26a1 Early Terminali', '/earlyv2'), ('\U0001f916 Premium AutoTrader', '/autotrade'),
              ('\U0001f4ca Durum', '/status'), ('\U0001f4c8 A\u00e7\u0131k Pozisyonlar', '/positions'),
              ('\U0001f4cb Bug\u00fcn\u00fcn \u0130\u015flemleri', '/daytrades'), ('\U0001f9fe \u0130\u015flem Listesi', '/daytradeslist'),
              ('\U0001f4c5 Bug\u00fcn A\u00e7\u0131lanlar', '/todaypositions'), ('\U0001f525 Is\u0131nan Coinler', '/top'),
              ('\U0001f9ea ALT Shadow', '/altstats'), ('\u2699\ufe0f Ayarlar', '/settings'),
              ('\u2753 Yard\u0131m', '/help'),
          )
          '''
          ux = ux[:menu_start] + menu + ux[menu_end:]
          alias_old = "                '/todayposition': '/todaypositions'})"
          alias_new = "                '/todayposition': '/todaypositions', '/earlyterminal': '/earlyv2'})"
          if ux.count(alias_old) != 1:
              raise SystemExit('alias anchor mismatch')
          ux = ux.replace(alias_old, alias_new, 1)
          ux_path.write_text(ux, encoding='utf-8')

          test_path = Path('tests/test_telegram_ux.py')
          test_text = test_path.read_text(encoding='utf-8')
          expected = "'/earlyv2','/autotrade','/earlyterminal','/status'"
          if test_text.count(expected) != 1:
              raise SystemExit('menu expectation anchor mismatch')
          test_text = test_text.replace(expected, "'/earlyv2','/autotrade','/status'", 1)
          test_path.write_text(test_text, encoding='utf-8')

          Path('.github/workflows/apply-early-live-terminal.yml').unlink()
          PY
      - name: Compile focused changes
        run: python -m compileall -q binance_momentum_bot tests
      - name: Verify Early LIVE controls
        env:
          PYTHONPATH: binance_momentum_bot:tests
          PYTHON_DOTENV_DISABLED: '1'
        run: |
          python - <<'PY'
          from pathlib import Path
          from early_autotrader_v2 import Config
          from execution_v2 import Blocked

          Config(margin=200, leverage=10).validate()
          for cfg in (Config(margin=201, leverage=10), Config(margin=200, leverage=11)):
              try:
                  cfg.validate()
              except Blocked:
                  pass
              else:
                  raise SystemExit('Early ceiling did not fail closed')
          source = Path('binance_momentum_bot/early_v2_adapter.py').read_text(encoding='utf-8')
          for token in ('Bildirimler', "('Anapara','margin')", "('Kald\\u0131ra\\u00e7','leverage')", '150,200', '7,10'):
              if token not in source:
                  raise SystemExit('missing unified terminal token: ' + token)
          bot = Path('binance_momentum_bot/bot.py').read_text(encoding='utf-8')
          if 'await early_v2.arm_async(st.active_radar_id, symbol, m, score)' not in bot:
              raise SystemExit('Public Early engine binding missing')
          PY
          python -m unittest -v test_early_notification_terminal test_telegram_ux.MenuTests
      - name: Commit patch to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat: unify Early notifications and LIVE trading terminal'
          git push origin HEAD:feat/early-notification-terminal-20261105
