name: Finalize unified Early LIVE terminal v4

on:
  push:
    branches:
      - feat/early-notification-terminal-20261105
    paths:
      - .github/workflows/finalize-unified-early-terminal-v4.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/early-notification-terminal-20261105
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r binance_momentum_bot/requirements.txt
      - name: Keep one Early terminal and update focused contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          ux_path = Path('binance_momentum_bot/telegram_ux.py')
          ux = ux_path.read_text(encoding='utf-8')
          if ux.count('import notification_policy\n') != 1:
              raise SystemExit('notification_policy import mismatch')
          ux = ux.replace('import notification_policy\n', '', 1)
          start = ux.index('def early_notification_text():\n')
          end = ux.index('async def observer_open', start)
          ux = ux[:start] + ux[end:]
          hook = "    if data.startswith('earlynotify:'):\n        return await early_notification_callback(bot, session, cb)\n"
          if ux.count(hook) != 1:
              raise SystemExit('legacy callback hook mismatch')
          ux = ux.replace(hook, '', 1)
          old_supported = "    supported = ('/menu', '/help', '/earlyterminal', '/daytradeslist', '/positions', '/todaypositions', '/reportstatus',\n"
          new_supported = "    supported = ('/menu', '/help', '/daytradeslist', '/positions', '/todaypositions', '/reportstatus',\n"
          if ux.count(old_supported) != 1:
              raise SystemExit('legacy supported route mismatch')
          ux = ux.replace(old_supported, new_supported, 1)
          route_start = ux.index("    if text == '/earlyterminal':\n")
          route_end = ux.index("    if text == '/help':\n", route_start)
          ux = ux[:route_start] + ux[route_end:]
          ux_path.write_text(ux, encoding='utf-8')

          test_path = Path('tests/test_early_autotrader_v2.py')
          test_text = test_path.read_text(encoding='utf-8')
          old = "self.assertEqual(len(labels),12);self.assertIn('Kill Switch',labels);self.assertIn('Min V2 Score',labels)"
          new = "self.assertEqual(len(labels),13);self.assertIn('Bildirimler',labels);self.assertIn('Kill Switch',labels);self.assertIn('Min V2 Score',labels)"
          if test_text.count(old) != 1:
              raise SystemExit('legacy menu-count contract mismatch')
          test_path.write_text(test_text.replace(old, new, 1), encoding='utf-8')

          workflow_path = Path('.github/workflows/early-notification-terminal-regression.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          old_command = 'run: python -m unittest -v test_early_notification_terminal'
          new_command = 'run: python -m unittest -v test_early_notification_terminal test_early_live_terminal'
          if workflow.count(old_command) != 1:
              raise SystemExit('focused test command mismatch')
          workflow_path.write_text(
              workflow.replace(old_command, new_command, 1),
              encoding='utf-8',
          )
          PY
      - name: Install verified behavior tests
        run: |
          echo '' | base64 -d > tests/test_early_notification_terminal.py
          echo '' | base64 -d > tests/test_early_live_terminal.py
      - name: Compile and run focused safety tests
        env:
          PYTHONPATH: binance_momentum_bot:tests
          PYTHON_DOTENV_DISABLED: '1'
        run: |
          python -m compileall -q binance_momentum_bot tests
          python -m unittest -v \
            test_early_notification_terminal \
            test_early_live_terminal \
            test_early_autotrader_v2.MathTests \
            test_early_autotrader_v2.PilotTests.test_live_requires_second_confirmation \
            test_early_autotrader_v2.PilotTests.test_menu_contains_all_requested_controls \
            test_early_autotrader_v2.PilotTests.test_price_chase_blocked \
            test_early_autotrader_v2.PilotTests.test_unauthorized_telegram_cannot_change_state \
            test_early_autotrader_v2.PilotTests.test_unvalidated_score_blocks_live \
            test_telegram_ux.MenuTests.test_aliases_and_keyboard_commands \
            test_telegram_ux.MenuTests.test_menu_and_help_are_read_only_and_admin_gated \
            test_telegram_ux.MenuTests.test_mode_needs_actor_bound_confirmation_and_live_stays_locked
          git diff --exit-code 5e56e1a3dfc9071bfc2405cb1e7b43e0c3148a34 HEAD -- binance_momentum_bot/bot.py
      - name: Commit verified implementation
        run: |
          rm -f .github/workflows/finalize-unified-early-terminal.yml
          rm -f .github/workflows/finalize-unified-early-terminal-v3.yml
          rm -f .github/workflows/finalize-unified-early-terminal-v4.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'test: finalize unified Early LIVE terminal behavior'
          git push origin HEAD:feat/early-notification-terminal-20261105
