name: Commit verified unified Early LIVE terminal

on:
  push:
    branches:
      - feat/early-notification-terminal-20261105
    paths:
      - .github/workflows/finalize-unified-early-terminal-v5.yml

permissions:
  contents: write

jobs:
  commit-verified-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/early-notification-terminal-20261105
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r binance_momentum_bot/requirements.txt
      - name: Reuse reviewed v4 transformation
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/finalize-unified-early-terminal-v4.yml').read_text(encoding='utf-8')
          first = source.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          first_end = source.index("\n          PY\n", first)
          Path('/tmp/finalize_code.py').write_text(
              textwrap.dedent(source[first:first_end]) + '\n',
              encoding='utf-8',
          )

          marker = "      - name: Install verified behavior tests\n        run: |\n"
          shell_start = source.index(marker) + len(marker)
          shell_end = source.index("\n      - name: Compile and run focused safety tests", shell_start)
          Path('/tmp/install_verified_tests.sh').write_text(
              textwrap.dedent(source[shell_start:shell_end]) + '\n',
              encoding='utf-8',
          )
          PY
          python /tmp/finalize_code.py
          bash /tmp/install_verified_tests.sh
      - name: Re-run focused behavior and safety suite
        env:
          PYTHONPATH: binance_momentum_bot:tests
          PYTHON_DOTENV_DISABLED: '1'
        run: |
          python -m compileall -q binance_momentum_bot tests
          python -m unittest -v \
            test_early_notification_terminal \
            test_early_live_terminal \
            test_early_autotrader_v2.MathTests \
            test_early_autotrader_v2.PilotTests.test_live_requires_second_confirmation \
            test_early_autotrader_v2.PilotTests.test_menu_contains_all_requested_controls \
            test_early_autotrader_v2.PilotTests.test_price_chase_blocked \
            test_early_autotrader_v2.PilotTests.test_unauthorized_telegram_cannot_change_state \
            test_early_autotrader_v2.PilotTests.test_unvalidated_score_blocks_live \
            test_telegram_ux.MenuTests.test_aliases_and_keyboard_commands \
            test_telegram_ux.MenuTests.test_menu_and_help_are_read_only_and_admin_gated \
            test_telegram_ux.MenuTests.test_mode_needs_actor_bound_confirmation_and_live_stays_locked
          git diff --exit-code 5e56e1a3dfc9071bfc2405cb1e7b43e0c3148a34 HEAD -- binance_momentum_bot/bot.py
      - name: Commit only verified code and test files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            binance_momentum_bot/telegram_ux.py \
            tests/test_early_autotrader_v2.py \
            tests/test_early_notification_terminal.py \
            tests/test_early_live_terminal.py
          git diff --cached --quiet && exit 0
          git commit -m 'test: finalize unified Early LIVE terminal behavior'
          git push origin HEAD:feat/early-notification-terminal-20261105
