name: Runtime supervisor diagnostics
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r binance_momentum_bot/requirements.txt
      - run: python -m compileall -q binance_momentum_bot tests
      - id: full
        name: Capture full regression output
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v > full-regression.txt 2>&1
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - id: p0
        name: Capture P0 safety output
        shell: bash
        env:
          PYTHONPATH: binance_momentum_bot:tests
          PYTHON_DOTENV_DISABLED: '1'
        run: |
          set +e
          python -m unittest -v test_telemetry_p0 test_v5135 test_integration \
            test_early_checkpoint_shadow test_early_exit_export test_runner_shadow_v1 test_information_only \
            test_runner_notify_safety.RunnerNotifySafetyTests.test_default_off_preserves_fast_and_reacquire_decisions_and_telemetry \
            test_runner_notify_safety.RunnerNotifySafetyTests.test_unset_off_empty_and_invalid_values_never_queue_or_start_transport \
            test_runner_notify_safety.RunnerNotifySafetyTests.test_explicit_opt_in_queues_with_mocked_worker \
            > p0-safety.txt 2>&1
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-supervisor-diagnostics
          path: |
            full-regression.txt
            p0-safety.txt
          if-no-files-found: error
          retention-days: 1
      - name: Preserve test verdict
        shell: bash
        run: |
          test "${{ steps.full.outputs.rc }}" = "0"
          test "${{ steps.p0.outputs.rc }}" = "0"
