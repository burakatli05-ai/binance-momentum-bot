name: Quality shadow isolation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-and-recorder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r research/requirements.txt -r binance_momentum_bot/requirements.txt
      - run: python -m unittest discover -s tests -p 'test_quality_shadow.py' -v
      - run: python -m unittest discover -s tests -p 'test_reweight_backtest.py' -v
      - run: python -m unittest discover -s tests -p 'test_execution_counterfactual.py' -v
      - run: python -m unittest discover -s tests -p 'test_quality_bot.py' -v
