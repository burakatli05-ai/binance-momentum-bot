name: Run unified Early LIVE terminal patch

on:
  push:
    branches:
      - feat/early-notification-terminal-20261105
    paths:
      - .github/workflows/apply-early-live-terminal-runner.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/early-notification-terminal-20261105
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: pip install -r binance_momentum_bot/requirements.txt
      - name: Extract and execute reviewed patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/apply-early-live-terminal.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          patch = textwrap.dedent(source[start:end]) + "\n"
          Path('/tmp/apply_early_live.py').write_text(patch, encoding='utf-8')
          PY
          python /tmp/apply_early_live.py
      - name: Compile and run focused tests
        env:
          PYTHONPATH: binance_momentum_bot:tests
          PYTHON_DOTENV_DISABLED: '1'
        run: |
          python -m compileall -q binance_momentum_bot tests
          python -m unittest -v \
            test_early_notification_terminal \
            test_telegram_ux.MenuTests.test_aliases_and_keyboard_commands \
            test_telegram_ux.MenuTests.test_menu_and_help_are_read_only_and_admin_gated \
            test_telegram_ux.MenuTests.test_mode_needs_actor_bound_confirmation_and_live_stays_locked \
            test_telegram_ux.MenuTests.test_ownership_display_only \
            test_telegram_ux.MenuTests.test_pagination_preserves_text_under_telegram_limit \
            test_telegram_ux.MenuTests.test_reportstatus_is_read_only_and_does_not_assert_fresh_check
          python - <<'PY'
          from pathlib import Path
          from early_autotrader_v2 import Config
          from execution_v2 import Blocked

          Config(margin=200, leverage=10).validate()
          for cfg in (Config(margin=201, leverage=10), Config(margin=200, leverage=11)):
              try:
                  cfg.validate()
              except Blocked:
                  pass
              else:
                  raise SystemExit('Early ceiling did not fail closed')
          adapter = Path('binance_momentum_bot/early_v2_adapter.py').read_text(encoding='utf-8')
          for token in ('Bildirimler', "('Anapara','margin')", '150,200', '7,10'):
              if token not in adapter:
                  raise SystemExit('missing unified terminal token: ' + token)
          bot = Path('binance_momentum_bot/bot.py').read_text(encoding='utf-8')
          if 'await early_v2.arm_async(st.active_radar_id, symbol, m, score)' not in bot:
              raise SystemExit('Public Early engine binding missing')
          PY
      - name: Commit verified implementation
        run: |
          rm -f .github/workflows/apply-early-live-terminal-runner.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat: unify Early notifications and LIVE trading terminal'
          git push origin HEAD:feat/early-notification-terminal-20261105
