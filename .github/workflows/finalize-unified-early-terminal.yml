name: Finalize unified Early LIVE terminal

on:
  push:
    branches:
      - feat/early-notification-terminal-20261105
    paths:
      - .github/workflows/finalize-unified-early-terminal.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/early-notification-terminal-20261105
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r binance_momentum_bot/requirements.txt
      - name: Remove legacy notification-only panel and add behavior tests
        run: |
          python - <<'PY'
          from pathlib import Path

          ux_path = Path('binance_momentum_bot/telegram_ux.py')
          ux = ux_path.read_text(encoding='utf-8')
          if ux.count('import notification_policy\n') != 1:
              raise SystemExit('notification_policy import mismatch')
          ux = ux.replace('import notification_policy\n', '', 1)
          start = ux.index('def early_notification_text():\n')
          end = ux.index('async def observer_open', start)
          ux = ux[:start] + ux[end:]
          callback_hook = "    if data.startswith('earlynotify:'):\n        return await early_notification_callback(bot, session, cb)\n"
          if ux.count(callback_hook) != 1:
              raise SystemExit('legacy callback hook mismatch')
          ux = ux.replace(callback_hook, '', 1)
          supported_old = "    supported = ('/menu', '/help', '/earlyterminal', '/daytradeslist', '/positions', '/todaypositions', '/reportstatus',\n"
          supported_new = "    supported = ('/menu', '/help', '/daytradeslist', '/positions', '/todaypositions', '/reportstatus',\n"
          if ux.count(supported_old) != 1:
              raise SystemExit('legacy supported route mismatch')
          ux = ux.replace(supported_old, supported_new, 1)
          route_start = ux.index("    if text == '/earlyterminal':\n")
          route_end = ux.index("    if text == '/help':\n", route_start)
          ux = ux[:route_start] + ux[route_end:]
          ux_path.write_text(ux, encoding='utf-8')

          Path('tests/test_early_notification_terminal.py').write_text(r'''import importlib
          import json
          import os
          import tempfile
          import unittest
          from pathlib import Path


          class EarlyNotificationPolicyTests(unittest.TestCase):
              def setUp(self):
                  self.tempdir = tempfile.TemporaryDirectory()
                  self.state_path = Path(self.tempdir.name) / 'early-notification.json'
                  self.old_path = os.environ.get('EARLY_NOTIFICATION_STATE_PATH')
                  self.old_default = os.environ.get('EARLY_SIGNAL_TELEGRAM_ENABLED')
                  os.environ['EARLY_NOTIFICATION_STATE_PATH'] = str(self.state_path)
                  os.environ['EARLY_SIGNAL_TELEGRAM_ENABLED'] = '0'
                  import notification_policy
                  self.policy = importlib.reload(notification_policy)

              def tearDown(self):
                  if self.old_path is None:
                      os.environ.pop('EARLY_NOTIFICATION_STATE_PATH', None)
                  else:
                      os.environ['EARLY_NOTIFICATION_STATE_PATH'] = self.old_path
                  if self.old_default is None:
                      os.environ.pop('EARLY_SIGNAL_TELEGRAM_ENABLED', None)
                  else:
                      os.environ['EARLY_SIGNAL_TELEGRAM_ENABLED'] = self.old_default
                  self.tempdir.cleanup()

              def test_environment_default_is_used_before_terminal_override(self):
                  self.assertFalse(self.policy.early_signal_notifications_enabled())
                  os.environ['EARLY_SIGNAL_TELEGRAM_ENABLED'] = '1'
                  self.assertTrue(self.policy.early_signal_notifications_enabled())
                  self.assertEqual(self.policy.early_signal_notification_status()['source'], 'environment')

              def test_terminal_toggle_persists_across_reload(self):
                  self.assertTrue(self.policy.set_early_signal_notifications_enabled(True))
                  self.assertEqual(json.loads(self.state_path.read_text())['enabled'], True)
                  self.policy = importlib.reload(self.policy)
                  self.assertTrue(self.policy.early_signal_notifications_enabled())
                  self.assertEqual(self.policy.early_signal_notification_status()['source'], 'persistent')
                  self.assertFalse(self.policy.set_early_signal_notifications_enabled(False))
                  self.assertFalse(self.policy.early_signal_notifications_enabled())

              def test_malformed_override_falls_back_and_non_boolean_is_rejected(self):
                  os.environ['EARLY_SIGNAL_TELEGRAM_ENABLED'] = '1'
                  for payload in ('not-json', json.dumps([]), json.dumps({}), json.dumps({'enabled': 'false'})):
                      with self.subTest(payload=payload):
                          self.state_path.write_text(payload, encoding='utf-8')
                          self.policy = importlib.reload(self.policy)
                          self.assertTrue(self.policy.early_signal_notifications_enabled())
                  with self.assertRaises(TypeError):
                      self.policy.set_early_signal_notifications_enabled('false')


          if __name__ == '__main__':
              unittest.main()
          '''.replace('\n          ', '\n').lstrip(), encoding='utf-8')

          Path('tests/test_early_live_terminal.py').write_text(r'''import asyncio
          import importlib
          import os
          import sqlite3
          import tempfile
          import unittest
          from pathlib import Path
          from unittest.mock import AsyncMock

          from early_autotrader_v2 import Config, Pilot
          from early_v2_adapter import Adapter
          from execution_v2 import Blocked
          import notification_policy
          import telegram_ux


          class EarlyLiveTerminalTests(unittest.TestCase):
              def setUp(self):
                  self.tempdir = tempfile.TemporaryDirectory()
                  self.db_path = Path(self.tempdir.name) / 'early-live.db'
                  self.state_path = Path(self.tempdir.name) / 'early-notification.json'
                  self.old_state = os.environ.get('EARLY_NOTIFICATION_STATE_PATH')
                  self.old_default = os.environ.get('EARLY_SIGNAL_TELEGRAM_ENABLED')
                  os.environ['EARLY_NOTIFICATION_STATE_PATH'] = str(self.state_path)
                  os.environ['EARLY_SIGNAL_TELEGRAM_ENABLED'] = '0'
                  importlib.reload(notification_policy)

                  def connect():
                      return sqlite3.connect(self.db_path)

                  self.pilot = Pilot(connect, live_allowed=True, score_validated=True)
                  self.adapter = object.__new__(Adapter)
                  self.adapter.pilot = self.pilot
                  self.adapter.step_lock = None
                  self.adapter.b = {
                      '_at_admin_allowed': lambda chat, user, require_user_id=False: (chat, user) == ('admin', 'owner'),
                      'BINANCE_API_KEY': 'configured',
                      'BINANCE_API_SECRET': 'configured',
                  }
                  self.adapter.show = AsyncMock(return_value=None)

              def tearDown(self):
                  if self.old_state is None:
                      os.environ.pop('EARLY_NOTIFICATION_STATE_PATH', None)
                  else:
                      os.environ['EARLY_NOTIFICATION_STATE_PATH'] = self.old_state
                  if self.old_default is None:
                      os.environ.pop('EARLY_SIGNAL_TELEGRAM_ENABLED', None)
                  else:
                      os.environ['EARLY_SIGNAL_TELEGRAM_ENABLED'] = self.old_default
                  self.tempdir.cleanup()

              def test_200_usdt_and_10x_are_valid_fail_closed_ceilings(self):
                  Config(margin=200, leverage=10).validate()
                  with self.assertRaises(Blocked):
                      Config(margin=200.01, leverage=10).validate()
                  with self.assertRaises(Blocked):
                      Config(margin=200, leverage=11).validate()

              def test_one_panel_shows_notifications_mode_anapara_leverage_and_nominal(self):
                  self.pilot.configure('margin', 200)
                  self.pilot.configure('leverage', 10)
                  notification_policy.set_early_signal_notifications_enabled(True)
                  text = self.adapter.status()
                  self.assertIn('⚡ EARLY TERMİNALİ', text)
                  self.assertIn('Bildirimler: 🟢 AÇIK', text)
                  self.assertIn('İşlem modu: OFF', text)
                  self.assertIn('Anapara (teminat): 200 USDT', text)
                  self.assertIn('Kaldıraç: 10x', text)
                  self.assertIn('Nominal pozisyon: yaklaşık 2000 USDT', text)
                  labels = [button['text'] for row in self.adapter.markup()['inline_keyboard'] for button in row]
                  for label in ('Bildirimler', 'Mod', 'Anapara', 'Kaldıraç'):
                      self.assertIn(label, labels)

              def test_panel_choices_include_200_usdt_and_10x(self):
                  asyncio.run(self.adapter.command(None, '/earlyv2 margin', 'admin', 'owner'))
                  margin_markup = self.adapter.show.await_args.args[3]
                  margin_values = [button['text'] for row in margin_markup['inline_keyboard'] for button in row]
                  self.assertIn('200', margin_values)
                  self.adapter.show.reset_mock()
                  asyncio.run(self.adapter.command(None, '/earlyv2 leverage', 'admin', 'owner'))
                  leverage_markup = self.adapter.show.await_args.args[3]
                  leverage_values = [button['text'] for row in leverage_markup['inline_keyboard'] for button in row]
                  self.assertIn('10', leverage_values)

              def test_notification_toggle_is_inside_same_early_terminal(self):
                  self.assertFalse(notification_policy.early_signal_notifications_enabled())
                  self.assertTrue(asyncio.run(self.adapter.command(None, '/earlyv2 notify', 'admin', 'owner')))
                  self.assertTrue(notification_policy.early_signal_notifications_enabled())
                  self.adapter.show.assert_awaited_once()

              def test_live_requires_second_confirmation_and_settings_freeze(self):
                  self.pilot.configure('margin', 200)
                  self.pilot.configure('leverage', 10)
                  self.pilot.set_mode('DRY')
                  with self.assertRaises(Blocked):
                      self.pilot.set_mode('LIVE')
                  token = self.pilot.challenge('admin:owner', 'LIVE')
                  self.pilot.confirm('admin:owner', token, ready=True, kind='LIVE')
                  self.assertEqual(self.pilot.mode, 'LIVE')
                  with self.assertRaises(Blocked):
                      self.pilot.configure('margin', 100)

              def test_single_menu_entry_alias_and_public_early_binding(self):
                  labels = [label for label, _ in telegram_ux.MENU]
                  self.assertEqual(labels.count('⚡ Early Terminali'), 1)
                  self.assertNotIn('🔔 Early Bildirimleri', labels)
                  self.assertEqual(telegram_ux.normalize('/earlyterminal'), '/earlyv2')
                  source = Path('binance_momentum_bot/bot.py').read_text(encoding='utf-8')
                  self.assertIn('await early_v2.arm_async(st.active_radar_id, symbol, m, score)', source)
                  self.assertIn('notification_kind="EARLY"', source)


          if __name__ == '__main__':
              unittest.main()
          '''.replace('\n          ', '\n').lstrip(), encoding='utf-8')

          workflow_path = Path('.github/workflows/early-notification-terminal-regression.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          workflow = workflow.replace(
              'run: python -m unittest -v test_early_notification_terminal',
              'run: python -m unittest -v test_early_notification_terminal test_early_live_terminal',
              1,
          )
          workflow_path.write_text(workflow, encoding='utf-8')
          PY
      - name: Run focused behavior and safety tests
        env:
          PYTHONPATH: binance_momentum_bot:tests
          PYTHON_DOTENV_DISABLED: '1'
        run: |
          python -m compileall -q binance_momentum_bot tests
          python -m unittest -v \
            test_early_notification_terminal \
            test_early_live_terminal \
            test_early_autotrader_v2.MathTests \
            test_early_autotrader_v2.PilotTests.test_live_requires_second_confirmation \
            test_early_autotrader_v2.PilotTests.test_menu_contains_all_requested_controls \
            test_early_autotrader_v2.PilotTests.test_price_chase_blocked \
            test_early_autotrader_v2.PilotTests.test_unauthorized_telegram_cannot_change_state \
            test_early_autotrader_v2.PilotTests.test_unvalidated_score_blocks_live \
            test_telegram_ux.MenuTests.test_aliases_and_keyboard_commands \
            test_telegram_ux.MenuTests.test_menu_and_help_are_read_only_and_admin_gated \
            test_telegram_ux.MenuTests.test_mode_needs_actor_bound_confirmation_and_live_stays_locked
          git diff --exit-code 5e56e1a3dfc9071bfc2405cb1e7b43e0c3148a34 HEAD -- binance_momentum_bot/bot.py
      - name: Commit finalized implementation
        run: |
          rm -f .github/workflows/finalize-unified-early-terminal.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'test: finalize unified Early LIVE terminal behavior'
          git push origin HEAD:feat/early-notification-terminal-20261105
